name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d artconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # ista imena varijabli koje čita settings.py (vidi .env.example)
    env:
      POSTGRES_DB: artconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost   # u GitHub Actions baza je na localhostu, ne na "db"
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check project configuration
        run: python manage.py check

      - name: Check that all migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test