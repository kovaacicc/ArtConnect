name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d artconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # ista imena varijabli koje čita settings.py (vidi .env.example)
    env:
      POSTGRES_DB: artconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost   # u GitHub Actions baza je na localhostu, ne na "db"
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check project configuration
        run: python manage.py check

      - name: Check that all migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  selenium-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      # dummy vrijednosti, samo za CI (vidi .env.example)
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only/' .env
          sed -i 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-only-not-a-real-secret/' .env

      - name: Start app
        run: docker compose -f docker-compose-dev.yaml up --build -d

      - name: Wait for app
        run: curl --retry 30 --retry-delay 2 --retry-connrefused -sf http://localhost/ -o /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # exit code 5 = još nema testova, to ne smije rušiti pipeline
      - name: Run Selenium tests
        run: |
          pytest tests/selenium || [ $? -eq 5 ]
        env:
          BASE_URL: http://localhost

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose-dev.yaml logs

      - name: Stop app
        if: always()
        run: docker compose -f docker-compose-dev.yaml down -v
